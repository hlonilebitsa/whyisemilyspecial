<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Closed</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: "Times New Roman", Georgia, serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: clamp(2rem, 4vw, 3.2rem);
            font-weight: normal;
            font-style: italic;
            letter-spacing: 0.5px;
            line-height: 1.5;
        }

        .date {
            margin-top: 14px;
            font-size: 0.65rem;
            font-style: italic;
            color: #bdbdbd;
            letter-spacing: 0.8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>This website has been officially closed by admin.</h1>
        <div class="date">3 August 2026</div>
    </div>

</body>
</html>
