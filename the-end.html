<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The End</title>

    <!-- Romantic Font -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            height:100vh;
            overflow:hidden;
            background:black;
            font-family:'Playfair Display', serif;
            position:relative;
        }

        /* ===========================
           BACKGROUND IMAGE
        =========================== */

        .bg{
            position:absolute;
            inset:0;
            width:100%;
            height:100%;
            object-fit:contain;
            background:black;
            z-index:1;
        }

        /* ===========================
              THE END
        =========================== */

        .end-text{
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            font-family:'Great Vibes', cursive;
            font-size:68px;
            color:white;
            text-shadow:0 5px 15px rgba(0,0,0,.7);
            display:flex;
            align-items:center;
            gap:12px;
            z-index:3;
        }

        .heart{
            color:#ff3d5a;
            font-size:40px;
        }

        /* ===========================
             BACK BUTTON
        =========================== */

        .back{

            position:absolute;

            bottom:25px;

            left:50%;

            transform:translateX(-50%);

            text-decoration:none;

            background:#ff8fa3;

            color:white;

            padding:11px 24px;

            border-radius:25px;

            font-weight:bold;

            transition:.3s;

            z-index:5;

        }

        .back:hover{

            background:#ff6f91;

        }

        /* ===========================
            SECRET HOTSPOT
        =========================== */

        .secret-zone{

            position:absolute;

            /* Same vertical position as the Back button */
            bottom:0;

            /* A little to the right of the Back button */
            left:calc(50% + 95px);

            /* About 5cm across (≈5cm radius) */
            width:10cm;
            height:9cm;

            border-radius:50%;

            background:transparent;

            cursor:pointer;

            z-index:6;

        }

        /*
        FOR TESTING ONLY

        Uncomment this block to see
        where the hotspot is.

        .secret-zone{
            background:red;
            opacity:.35;
        }

        */

    </style>

</head>

<body>

    <!-- Background Picture -->
    <img src="Images/author.jpg" class="bg" alt="Background">

    <!-- The End -->
    <div class="end-text">
        The End <span class="heart">♥</span>
    </div>

    <!-- Back Button -->
    <a href="page4.html" class="back">Back</a>

    <!-- Hidden Easter Egg -->
    <a href="New.html" class="secret-zone"></a>

</body>
</html>
